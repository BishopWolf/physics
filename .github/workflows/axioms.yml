name: proofs

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly run so toolchain or Mathlib drift shows up even without a commit.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache toolchain and Lake build
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            gravitation/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('gravitation/lean-toolchain', 'gravitation/lake-manifest.json', 'gravitation/lakefile.toml') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Fetch the Mathlib cache
        working-directory: gravitation
        run: lake exe cache get

      - name: Build the library
        working-directory: gravitation
        run: lake build

      - name: Check that the build is silent
        run: bash scripts/check_messages.sh

      - name: Axiom audit (proves every declaration stays inside the base axioms)
        run: bash scripts/audit_axioms.sh

      - name: Proof-status table is current
        run: bash scripts/proof_status.sh --check

  # The Vulkan check runs on a software driver, so it needs no GPU runner.
  vulkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install a software Vulkan driver and shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libvulkan-dev mesa-vulkan-drivers glslc

      - name: Build the tensor pass
        working-directory: gravitation/vulkan
        run: make

      - name: Run the Kretschmann check on lavapipe
        working-directory: gravitation/vulkan
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: ./gr_vulkan shaders/tensor.comp.spv
