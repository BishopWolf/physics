name: proofs

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly run so toolchain or Mathlib drift shows up even without a commit.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The GR modules are vendored from an unmerged branch; fail if the branch
      # tip or any vendored file moved without a matching re-vendor.
      - name: Vendored copy matches the Physlib gravity branch
        run: bash scripts/check_vendor_sync.sh

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache toolchain and Lake build
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            gravitation/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('gravitation/lean-toolchain', 'gravitation/lake-manifest.json', 'gravitation/lakefile.toml') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Fetch the Mathlib cache
        working-directory: gravitation
        run: lake exe cache get

      - name: Build the library
        working-directory: gravitation
        run: lake build

      - name: Check that the build is silent
        run: bash scripts/check_messages.sh

      - name: Axiom audit (proves every declaration stays inside the base axioms)
        run: bash scripts/audit_axioms.sh

      - name: Declaration census matches the audit
        run: bash scripts/check_census.sh

      - name: Proof-status table is current
        run: bash scripts/proof_status.sh --check

  # The Vulkan check runs on a software driver, so it needs no GPU runner.
  vulkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install a software Vulkan driver and shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libvulkan-dev mesa-vulkan-drivers glslc vulkan-tools

      # No GPU on the runner, so lavapipe is the only ICD the loader finds.  Do
      # not pin VK_ICD_FILENAMES: a wrong path makes the loader enumerate zero
      # devices instead of falling back to the default scan.
      - name: Show the Vulkan device
        run: vulkaninfo --summary

      - name: Build the tensor pass
        working-directory: gravitation/vulkan
        run: make

      - name: Run the Kretschmann check on the software driver
        working-directory: gravitation/vulkan
        run: ./gr_vulkan shaders/tensor.comp.spv
